#common: https://github.com/k8s-at-home/library-charts/tree/main/charts/stable/common
---
paperless:
  image:
    repository: ghcr.io/paperless-ngx/paperless-ngx
    tag: 2.12.0@sha256:7a1d34bfaba5243aa4398d3b8abadc7234b6aa844837b329d598bed5ca17a0a9
    pullPolicy: IfNotPresent

  envFrom:
    - secretRef:
        name: paperless-secret
  env:
    PAPERLESS_REDIS: "redis://redis-master.databases.svc.cluster.local:6379"
    PAPERLESS_DBHOST: "cnpg-cluster-rw.cnpg-system.svc.cluster.local"
    PAPERLESS_DBPORT: 5432
    PAPERLESS_TIME_ZONE: "America/Chicago"
    PAPERLESS_URL: "http://paperless"
    PAPERLESS_ALLOWED_HOSTS: "paperless"
    PAPERLESS_CORS_ALLOWED_HOSTS: "http://paperless"
    PAPERLESS_OCR_LANGUAGES: "eng"
    PAPERLESS_PORT: 8000

  service:
    main:
      annotations:
        tailscale.com/expose: "true"
        tailscale.com/hostname: "paperless"
      ports:
        http:
          port: 80
          targetPort: 8000

  ingress:
    main:
      enabled: false

  persistence:
    data:
      enabled: true
      existingClaim: pvc-paperless-data
    media:
      enabled: true
      existingClaim: pvc-paperless-media
    consume:
      enabled: true
      existingClaim: pvc-paperless-consume

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2048Mi"
